# Reverse proxy for the production stack (see docker-compose.prod.yml).
# /media/*  -> served directly from the uploads volume (never touches Node)
# /api/*    -> backend (NestJS)
# /*        -> frontend (Next.js)
#
# Port 80: ACME HTTP-01 challenge (for cert renewal) + redirect everything
# else to HTTPS. Port 443: real traffic, TLS terminated here.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name harmonydining.com.np www.harmonydining.com.np;

    ssl_certificate     /etc/letsencrypt/live/harmonydining.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harmonydining.com.np/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location /media/ {
        alias /media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js's own /api/route (OSRM driving-directions proxy for the map)
    # lives on the frontend, not the backend — carve it out before the
    # general /api/ -> backend rule below (exact match wins over prefix).
    location = /api/route {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
