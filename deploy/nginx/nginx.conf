# Reverse proxy for the production stack (see docker-compose.prod.yml).
# /media/*  -> served directly from the uploads volume (never touches Node)
# /api/*    -> backend (NestJS)
# /*        -> frontend (Next.js)
#
# Phase 1 of SSL bootstrap: HTTP only, but serves the ACME HTTP-01 challenge
# so certbot can issue a cert. Once a cert exists in the certbot-etc volume,
# a follow-up deploy adds the `listen 443 ssl` block + redirect.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /media/ {
        alias /media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
