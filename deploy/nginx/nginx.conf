# Reverse proxy for the production stack (see docker-compose.prod.yml).
# /media/*  -> served directly from the uploads volume (never touches Node)
# /api/*    -> backend (NestJS)
# /*        -> frontend (Next.js)
#
# HTTP only for now. Once a domain points at this VPS, add a certbot service
# and a second `listen 443 ssl` server block (see deploy README).

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /media/ {
        alias /media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
