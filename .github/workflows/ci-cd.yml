name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, e2e, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harmony
          POSTGRES_PASSWORD: harmony
          POSTGRES_DB: harmony_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmony -d harmony_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://harmony:harmony@localhost:5432/harmony_ci?schema=public
      SESSION_SECRET: ci-test-session-secret-not-used-in-prod
      LOG_LEVEL: error
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma:generate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm exec jest --runInBand

      - run: pnpm prisma migrate deploy

      - run: pnpm db:seed

      - run: pnpm test:e2e --runInBand

      - run: pnpm build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4100/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  containers:
    needs: [backend, frontend]
    uses: ./.github/workflows/container-smoke.yml

  deploy:
    name: Deploy to production
    needs: [backend, frontend, containers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          for setting in EC2_HOST EC2_USER EC2_SSH_KEY EC2_HOST_FINGERPRINT; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing production secret: $setting"
              exit 1
            fi
          done

      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          EC2_COMPOSE_PROJECT: ${{ vars.EC2_COMPOSE_PROJECT || 'harmony-dining' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: RELEASE_SHA,EC2_APP_DIR,EC2_COMPOSE_PROJECT
          command_timeout: 25m
          script: |
            set -eu
            cd "${EC2_APP_DIR:-$HOME/Harmony-Dining}"
            compose() {
              sudo -n docker compose -p "$EC2_COMPOSE_PROJECT" -f docker-compose.prod.yml "$@"
            }
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain)"
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_SHA" ]; then
              echo "Skipping $RELEASE_SHA because main advanced. The newer commit has its own CI run."
              exit 0
            fi
            git merge --ff-only "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            compose config --quiet
            sudo -n env COMPOSE_PROJECT_NAME="$EC2_COMPOSE_PROJECT" BACKUP_DIR=/var/backups/harmony sh deploy/backup.sh
            compose build backend
            compose build frontend
            compose up -d --wait --wait-timeout 180
            compose exec -T nginx nginx -t
            compose exec -T nginx nginx -s reload
