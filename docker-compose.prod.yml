# Production stack for a single VPS.
# Setup:
#   1. cp .env.example .env               (fill in real values)
#   2. cp backend/.env.example backend/.env.production   (fill in real values)
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres data and uploaded media live in named volumes, so they survive
# `docker compose up --build` (a rebuild only replaces the app images, never
# these volumes).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      # Overrides env_file: the app talks to Postgres over the compose
      # network, not localhost, and media lives on the mounted volume below.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      STORAGE_LOCAL_DIR: /app/storage/uploads
    volumes:
      - uploads-data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '4100'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - '3000'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads-data:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  uploads-data:
